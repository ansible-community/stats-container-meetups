# Pre-commit configuration - standard across all Claude projects
# Automatically fix issues where possible for markdown and JSON files

repos:
  # Pre-commit hooks for general file formatting
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-symlinks
      - id: debug-statements
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
      # Validate JSON syntax
      - id: check-json
        files: \.json$
      # Pretty format JSON files
      - id: pretty-format-json
        args: [--autofix, --indent=2]
        files: \.json$
      # Check for case conflicts on case-insensitive filesystems
      - id: check-case-conflict
      # Check for files that would conflict in vcs
      - id: check-vcs-permalinks
      # Check that files parse as valid YAML
      - id: check-yaml
        files: \.ya?ml$

  # Markdown linting and formatting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.38.0
    hooks:
      - id: markdownlint
        args: [--fix, --config, .markdownlint.json]
        files: \.md$
